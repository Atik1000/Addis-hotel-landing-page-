[package]
name = "addis-landing-website"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "addis-landing-website"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
axum = { version = "0.8.0", optional = true }
leptos_axum = { version = "0.8.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde_json = "1"
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
web-sys = { version = "0.3", features = [
    "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollToOptions",
    "Window", "Storage", "Navigator", "Clipboard",
    "Node", "Element", "EventTarget",
] }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:js-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:reqwest",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "addis-landing-website"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
# Content-addressed asset filenames. Without this the bundle is served as a
# fixed `addis-landing-website.wasm`, which browsers cache heuristically (the
# server sends no Cache-Control), so a returning visitor keeps running the
# previous deploy's WASM against the new server — and every server function
# 404s, because `server_fn` hashes its endpoints per build. Hashed names make
# each deploy a new URL, so that cannot happen.
hash-files = true
